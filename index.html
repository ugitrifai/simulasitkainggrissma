                                <!-- Metadata Soal -->

                                        <span class="text-indigo-600">${state.currentQuestionIndex + 1}.</span> ${currentQ.question}

                                    <!-- Render area jawaban sesuai jenis soal -->
                                    <div class="space-y-2.5 pt-2">
                                        ${renderAnswerOptions(currentQ)}
                                    </div>

                                <!-- Footer Navigasi Soal (Previous / Next) -->
                                <div class="pt-6 border-t border-slate-200 flex items-center justify-between shrink-0">
                                    <button onclick="prevQuestion()" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-100 disabled:opacity-40 disabled:hover:bg-white text-slate-700 font-semibold text-sm rounded-xl transition-all shadow-sm flex items-center gap-1.5">
                                        <i data-lucide="chevron-left" class="w-4 h-4"></i> Sebelumnya
                                    </button>
                                    
                                    ${state.currentQuestionIndex === quizData.length - 1 ? `
                                        <button onclick="confirmSubmit()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-600/10 transition-all flex items-center gap-2">
                                            KIRIM <i data-lucide="send" class="w-4 h-4"></i>
                                        </button>
                                    ` : `
                                        <button onclick="nextQuestion()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md transition-all flex items-center gap-1.5 ml-auto">
                                            Selanjutnya <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                        </button>
                                    `}
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Combine sidebar and main view
            container.innerHTML = sidebarHtml + mainContentHtml;
        }

        // --- RENDER ANSWER INPUTS BY QUESTION TYPE ---
        function renderAnswerOptions(q) {
            const currentAnswer = state.answers[q.id];

            if (q.type === 'single') {
                return q.options.map((option, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    const isChecked = currentAnswer === idx;
                    return `
                        <label class="flex items-start gap-3 p-3.5 bg-white hover:bg-indigo-50/40 border ${isChecked ? 'border-indigo-600 bg-indigo-50/30' : 'border-slate-200'} rounded-xl cursor-pointer transition-all shadow-sm group">
                            <input type="radio" name="q_${q.id}" value="${idx}" ${isChecked ? 'checked' : ''} onchange="saveAnswer(${q.id}, ${idx})" class="mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                            <div class="text-sm">
                                <span class="font-bold text-indigo-600 mr-1.5">${letter}.</span>
                                <span class="text-slate-700 group-hover:text-slate-900">${option}</span>
                            </div>
                        </label>
                    `;
                }).join('');
            } 
            
            else if (q.type === 'multiple') {
                return `
                    <div class="mb-2 px-3 py-1.5 bg-amber-50 border border-amber-100 rounded-lg text-amber-700 font-medium text-xs flex items-center gap-1.5">
                        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                        Pilihlah seluruh jawaban yang menurut Anda benar!
                    </div>
                    ${q.options.map((option, idx) => {
                        const letter = String.fromCharCode(65 + idx);
                        const answersList = currentAnswer || [];
                        const isChecked = answersList.includes(idx);
                        return `
                            <label class="flex items-start gap-3 p-3.5 bg-white hover:bg-indigo-50/40 border ${isChecked ? 'border-indigo-600 bg-indigo-50/30' : 'border-slate-200'} rounded-xl cursor-pointer transition-all shadow-sm group">
                                <input type="checkbox" value="${idx}" ${isChecked ? 'checked' : ''} onchange="saveMultipleAnswer(${q.id}, ${idx})" class="mt-1 h-4 w-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                                <div class="text-sm">
                                    <span class="font-bold text-indigo-600 mr-1.5">${letter}.</span>
                                    <span class="text-slate-700 group-hover:text-slate-900">${option}</span>
                                </div>
                            </label>
                        `;
                    }).join('')}
                `;
            } 
            
            else if (q.type === 'category') {
                const matrixAnswers = currentAnswer || {};
                return `
                    <div class="mb-2 px-3 py-1.5 bg-blue-50 border border-blue-100 rounded-lg text-blue-700 font-medium text-xs flex items-center gap-1.5">
                        <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
                        Tentukan klasifikasi yang paling sesuai untuk setiap pernyataan di bawah ini.
                    </div>
                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="min-w-full text-sm border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600 border-b border-slate-200">
                                        <th class="p-3 text-left font-bold">Pernyataan / Teknik</th>
                                        ${q.categories.map(cat => `
                                            <th class="p-3 text-center font-bold whitespace-nowrap">${cat}</th>
                                        `).join('')}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${q.rows.map(row => {
                                        return `
                                            <tr>
                                                <td class="p-3 font-medium text-slate-700">${row.text}</td>
                                                ${q.categories.map(cat => {
                                                    const isChecked = matrixAnswers[row.id] === cat;
                                                    return `
                                                        <td class="p-3 text-center">
                                                            <label class="inline-block p-1 cursor-pointer">
                                                                <input type="radio" name="matrix_${q.id}_${row.id}" value="${cat}" ${isChecked ? 'checked' : ''} onchange="saveMatrixAnswer(${q.id}, '${row.id}', '${cat}')" class="h-4.5 w-4.5 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                                                            </label>
                                                        </td>
                                                    `;
                                                }).join('')}
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }

        // Get fallback passage text for related questions (for safety)
        function getPassageTextForQuestion(passageId) {
            const found = quizData.find(q => q.passageId === passageId && q.passageText);
            return found ? found.passageText : "Teks pendukung tidak ditemukan.";
        }

        function getFriendlyType(type) {
            switch(type) {
                case 'single': return 'Pilihan Ganda';
                case 'multiple': return 'Pilihan Ganda Kompleks';
                case 'category': return 'Klasifikasi Matriks';
                default: return 'Soal';
            }
        }

        // Action Handlers
        window.goToQuestion = function(index) {
            state.currentQuestionIndex = index;
            state.activeTab = 'question'; // default view to question on mobile navigate
            renderScreen();
        };

        window.nextQuestion = function() {
            if (state.currentQuestionIndex < quizData.length - 1) {
                state.currentQuestionIndex++;
                state.activeTab = 'question';
                renderScreen();
            }
        };

        window.prevQuestion = function() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                state.activeTab = 'question';
                renderScreen();
            }
        };

        window.toggleSidebar = function() {
            state.sidebarOpen = !state.sidebarOpen;
            renderScreen();
        };

        window.setMobileTab = function(tab) {
            state.activeTab = tab;
            renderScreen();
        };

        // Saving Answers
        window.saveAnswer = function(questionId, value) {
            state.answers[questionId] = value;
            // Visual grid update without full refresh to feel instant
            updateNavigationGrid();
        };

        window.saveMultipleAnswer = function(questionId, optionIndex) {
            if (!state.answers[questionId]) {
                state.answers[questionId] = [];
            }
            const currentAnswers = state.answers[questionId];
            const idx = currentAnswers.indexOf(optionIndex);
            if (idx > -1) {
                currentAnswers.splice(idx, 1); // remove
            } else {
                currentAnswers.push(optionIndex); // add
            }
            updateNavigationGrid();
        };

        window.saveMatrixAnswer = function(questionId, rowId, category) {
            if (!state.answers[questionId]) {
                state.answers[questionId] = {};
            }
            state.answers[questionId][rowId] = category;
            updateNavigationGrid();
        };

        function updateNavigationGrid() {
            // Re-render sidebar navigation area only to prevent input focus loss
            const navEl = $('#grid-navigation');
            if (navEl) {
                navEl.innerHTML = quizData.map((q, idx) => {
                    const isCurrent = idx === state.currentQuestionIndex;
                    const isAnswered = state.answers[q.id] !== undefined && (
                        typeof state.answers[q.id] === 'object' 
                        ? Object.keys(state.answers[q.id]).length > 0 
                        : state.answers[q.id] !== ''
                    );
                    
                    let btnClass = "border border-slate-200 text-slate-600 hover:bg-slate-100";
                    if (isCurrent) {
                        btnClass = "bg-indigo-600 text-white font-bold ring-2 ring-indigo-600 ring-offset-2";
                    } else if (isAnswered) {
                        btnClass = "bg-indigo-50 border-indigo-200 text-indigo-700 font-semibold";
                    }

                    return `
                        <button onclick="goToQuestion(${idx})" class="h-10 text-sm rounded-lg flex items-center justify-center transition-all ${btnClass}">
                            ${idx + 1}
                        </button>
                    `;
                }).join('');
            }
        }

        // Custom interactive dialogs to avoid standard alerts
        function showCustomModal(options) {
            const modalContainer = document.createElement('div');
            modalContainer.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in";
            modalContainer.id = "custom-modal";
            modalContainer.innerHTML = `
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-100 transform scale-100 transition-transform">
                    <div class="flex items-center gap-3">
                        <div class="p-3 bg-${options.accentColor || 'indigo'}-50 text-${options.accentColor || 'indigo'}-600 rounded-full">
                            <i data-lucide="${options.icon || 'info'}" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900">${options.title}</h3>
                    </div>
                    <p class="text-sm text-slate-600 leading-relaxed">${options.message}</p>
                    <div class="flex items-center justify-end gap-3 pt-2">
                        ${options.showCancel ? `
                            <button id="modal-cancel" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-all">Batal</button>
                        ` : ''}
                        <button id="modal-confirm" class="px-5 py-2 text-sm font-semibold text-white bg-${options.accentColor || 'indigo'}-600 hover:bg-${options.accentColor || 'indigo'}-700 rounded-xl shadow-md transition-all">${options.confirmText || 'Ya, Lanjutkan'}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalContainer);
            if (window.lucide) window.lucide.createIcons();

            return new Promise((resolve) => {
                const modal = $('#custom-modal');
                const cancelBtn = $('#modal-cancel');
                const confirmBtn = $('#modal-confirm');

                if (cancelBtn) {
                    cancelBtn.addEventListener('click', () => {
                        modal.remove();
                        resolve(false);
                    });
                }
                confirmBtn.addEventListener('click', () => {
                    modal.remove();
                    resolve(true);
                });
            });
        }

        window.confirmSubmit = async function() {
            const unansweredCount = quizData.length - Object.keys(state.answers).length;
            const message = unansweredCount > 0 
                ? `Masih ada <strong class="text-rose-600">${unansweredCount} soal yang belum Anda jawab</strong>. Apakah Anda yakin ingin mengakhiri ujian dan melihat hasil skor?`
                : "Semua soal telah dijawab. Klik kirim untuk melihat analisis skor dan evaluasi belajar Anda.";

            const confirmed = await showCustomModal({
                title: "Kirim Jawaban Anda?",
                message: message,
                icon: "help-circle",
                accentColor: unansweredCount > 0 ? "rose" : "indigo",
                showCancel: true,
                confirmText: "Kirim Sekarang"
            });

            if (confirmed) {
                submitExam();
            }
        };

        function submitExam(isAuto = false) {
            clearInterval(state.timerInterval);

            // Calculate Score (Max 100)
            // 25 questions, each represents 4 points
            let correctQuestions = 0;

            quizData.forEach(q => {
                const userAnswer = state.answers[q.id];

                if (q.type === 'single') {
                    if (userAnswer === q.correctAnswer) {
                        correctQuestions++;
                    }
                } 
                
                else if (q.type === 'multiple') {
                    // Check if multiple choice list exactly matches the answer keys
                    if (Array.isArray(userAnswer)) {
                        const sortedUser = [...userAnswer].sort();
                        const sortedCorrect = [...q.correctAnswer].sort();
                        const isExactlyEqual = sortedUser.length === sortedCorrect.length && sortedUser.every((v, i) => v === sortedCorrect[i]);
                        if (isExactlyEqual) correctQuestions++;
                    }
                } 
                
                else if (q.type === 'category') {
                    // Matrix match check: all matrix answers must be correct
                    if (userAnswer && typeof userAnswer === 'object') {
                        let isAllCorrect = true;
                        const rowKeys = Object.keys(q.correctAnswer);
                        for (let rKey of rowKeys) {
                            if (userAnswer[rKey] !== q.correctAnswer[rKey]) {
                                isAllCorrect = false;
                                break;
                            }
                        }
                        if (isAllCorrect) correctQuestions++;
                    }
                }
            });

            state.score = correctQuestions * 4; // Each question is 4 points (25 * 4 = 100)
            state.correctCount = correctQuestions;

            // standard TKA predicates
            if (state.score >= 80) {
                state.predicate = "BAIK";
                state.predicateColor = "emerald";
                state.predicateBg = "bg-emerald-50 text-emerald-700 border-emerald-200";
            } else if (state.score >= 60) {
                state.predicate = "MEMADAI";
                state.predicateColor = "amber";
                state.predicateBg = "bg-amber-50 text-amber-700 border-amber-200";
            } else {
                state.predicate = "KURANG";
                state.predicateColor = "rose";
                state.predicateBg = "bg-rose-50 text-rose-700 border-rose-200";
            }

            state.currentScreen = 'result';
            renderScreen();
        }

        // --- RESULT & EVALUATION SCREEN ---
        function renderResultScreen(container) {
            container.className = "flex-1 overflow-y-auto bg-slate-50 p-4 md:p-8";

            let encouragingMessage = "";
            let medalEmoji = "🏆";
            if (state.predicate === "BAIK") {
                encouragingMessage = "Luar biasa! Penguasaan materi Bahasa Inggris Anda sangat kuat dan matang. Pertahankan performa akademis tingkat tinggi ini!";
                medalEmoji = "👑";
            } else if (state.predicate === "MEMADAI") {
                encouragingMessage = "Kerja bagus. Pemahaman Anda sudah cukup memadai untuk menghadapi ujian TKA SMA, namun beberapa poin evaluasi masih bisa ditingkatkan lagi.";
                medalEmoji = "⭐";
            } else {
                encouragingMessage = "Jangan berkecil hati. Nilai ini menunjukkan Anda memerlukan waktu ekstra untuk mempelajari kembali struktur kalimat dasar, kosakata, dan teknik skimming teks bacaan.";
                medalEmoji = "💪";
            }

            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-8">
                    <!-- Score Header Widget -->
                    <div class="bg-white border border-slate-200 p-6 md:p-10 rounded-3xl shadow-xl flex flex-col md:flex-row items-center gap-8 relative overflow-hidden">
                        <!-- Left decoration graphic -->
                        <div class="absolute top-0 right-0 w-48 h-48 bg-indigo-50 rounded-full translate-x-12 -translate-y-12 shrink-0 z-0 opacity-60"></div>
                        
                        <!-- Circular Score SVG -->
                        <div class="relative shrink-0 w-40 h-40 flex items-center justify-center z-10">
                            <svg class="w-full h-full transform -rotate-90">
                                <circle cx="80" cy="80" r="70" class="stroke-slate-100" stroke-width="12" fill="transparent"/>
                                <circle cx="80" cy="80" r="70" class="stroke-indigo-600" stroke-width="12" fill="transparent"
                                    stroke-dasharray="${2 * Math.PI * 70}"
                                    stroke-dashoffset="${2 * Math.PI * 70 * (1 - state.score / 100)}"
                                    stroke-linecap="round"/>
                            </svg>
                            <div class="absolute flex flex-col items-center">
                                <span class="text-4xl font-extrabold text-slate-900 tracking-tight">${state.score}</span>
                                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Skor TKA</span>
                            </div>
                        </div>

                        <!-- Predicate & Message info -->
                        <div class="flex-1 space-y-4 z-10 text-center md:text-left">
                            <div class="flex flex-col sm:flex-row items-center gap-2">
                                <span class="text-xs uppercase font-bold tracking-wider px-3 py-1 rounded-full bg-slate-100 text-slate-600">PREDIKAT KOGNITIF</span>
                                <div class="px-3.5 py-1 text-sm font-bold border rounded-full ${state.predicateBg} flex items-center gap-1">
                                    <span>${medalEmoji}</span>
                                    <span>${state.predicate}</span>
                                </div>
                            </div>
                            
                            <h2 class="text-2xl font-extrabold text-slate-900 leading-snug">
                                Evaluasi Hasil Penilaian Mandiri TKA SMA
                            </h2>
                            <p class="text-sm text-slate-600 leading-relaxed max-w-xl">
                                ${encouragingMessage}
                            </p>
                            <div class="flex items-center justify-center md:justify-start gap-4 text-xs font-semibold text-slate-500">
                                <span class="flex items-center gap-1"><i data-lucide="check" class="w-4 h-4 text-emerald-500"></i> Terjawab Benar: <strong>${state.correctCount}</strong> / 25</span>
                                <span class="flex items-center gap-1"><i data-lucide="award" class="w-4 h-4 text-indigo-500"></i> Akurasi: <strong>${(state.correctCount / 25 * 100).toFixed(0)}%</strong></span>
                            </div>
                        </div>
                    </div>

                    <!-- Retest and Review CTA buttons -->
                    <div class="flex flex-col sm:flex-row items-center gap-4 justify-between">
                        <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="search" class="w-5 h-5 text-indigo-500"></i>
                            Analisis Jawaban & Kunci Soal
                        </h3>
                        <button onclick="restartTest()" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-700 hover:to-sky-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/10 transition-all flex items-center gap-2">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> ULANGI UJIAN
                        </button>
                    </div>

                    <!-- Review List Section -->
                    <div class="space-y-4">
                        ${quizData.map((q, idx) => {
                            const userAnswer = state.answers[q.id];
                            let isCorrect = false;

                            // Re-calculate individual correctness for display
                            if (q.type === 'single') {
                                isCorrect = userAnswer === q.correctAnswer;
                            } else if (q.type === 'multiple') {
                                if (Array.isArray(userAnswer)) {
                                    const sortedUser = [...userAnswer].sort();
                                    const sortedCorrect = [...q.correctAnswer].sort();
                                    isCorrect = sortedUser.length === sortedCorrect.length && sortedUser.every((v, i) => v === sortedCorrect[i]);
                                }
                            } else if (q.type === 'category') {
                                if (userAnswer && typeof userAnswer === 'object') {
                                    isCorrect = true;
                                    const rowKeys = Object.keys(q.correctAnswer);
                                    for (let rKey of rowKeys) {
                                        if (userAnswer[rKey] !== q.correctAnswer[rKey]) {
                                            isCorrect = false;
                                            break;
                                        }
                                    }
                                }
                            }

                            return `
                                <div class="bg-white border ${isCorrect ? 'border-emerald-100' : 'border-rose-100'} rounded-2xl p-5 shadow-sm space-y-3 relative overflow-hidden">

                                        <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-3.5 h-3.5"></i>
                                        <span>${isCorrect ? 'Benar' : 'Salah'}</span>
                                    </div>

                                    <div class="text-[11px] font-bold text-slate-400">SOAL NO. ${idx + 1} &middot; ${getFriendlyType(q.type)}</div>
                                    <p class="font-semibold text-slate-800 leading-snug pr-16">${q.question}</p>
                                    
                                    <!-- Rendered Selection Review -->
                                    <div class="text-xs space-y-2 pt-1">
                                        ${renderAnswerReviewHtml(q, userAnswer)}
                                    </div>

                                    <!-- Explanation Block -->
                                    <div class="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-600 space-y-1">
                                        <div class="font-bold text-slate-700 flex items-center gap-1"><i data-lucide="help-circle" class="w-3.5 h-3.5"></i> Penjelasan Kunci Jawaban:</div>
                                        <p class="leading-relaxed font-normal">${q.explanation}</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- RENDER DETAIL REVIEW FOR EACH QUESTION ---
        function renderAnswerReviewHtml(q, userAnswer) {
            if (q.type === 'single') {
                return `
                    <div class="space-y-1">
                        <div>Jawaban Anda: <strong class="${userAnswer === q.correctAnswer ? 'text-emerald-600' : 'text-rose-600'}">${userAnswer !== undefined ? String.fromCharCode(65 + userAnswer) : 'Tidak Menjawab'}</strong></div>
                        <div>Kunci Jawaban: <strong class="text-emerald-600">${String.fromCharCode(65 + q.correctAnswer)}</strong></div>
                    </div>
                `;
            } else if (q.type === 'multiple') {
                const userLetters = Array.isArray(userAnswer) ? userAnswer.map(v => String.fromCharCode(65 + v)).join(', ') : 'Tidak Menjawab';
                const correctLetters = q.correctAnswer.map(v => String.fromCharCode(65 + v)).join(', ');
                return `
                    <div class="space-y-1">
                        <div>Jawaban Anda: <strong class="text-slate-800">${userLetters}</strong></div>
                        <div>Kunci Jawaban: <strong class="text-emerald-600">${correctLetters}</strong></div>
                    </div>
                `;
            } else if (q.type === 'category') {
                const matrixAnswers = userAnswer || {};
                return `
                    <div class="bg-slate-50 border border-slate-100 rounded-lg p-2.5 space-y-1.5 mt-1">
                        ${q.rows.map(row => {
                            const uAns = matrixAnswers[row.id] || 'Tidak Menjawab';
                            const cAns = q.correctAnswer[row.id];
                            return `
                                <div class="flex items-center justify-between border-b border-dashed border-slate-200/60 pb-1 last:border-b-0 last:pb-0">
                                    <span class="text-[11px] font-medium text-slate-600 shrink-0 mr-4">${row.text}:</span>
                                    <div class="text-[11px]">
                                        <span class="text-slate-500">Anda:</span> <strong class="${uAns === cAns ? 'text-emerald-600' : 'text-rose-600'}">${uAns}</strong> 
                                        &middot; <span class="text-slate-500">Kunci:</span> <strong class="text-emerald-600">${cAns}</strong>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        window.restartTest = function() {
            state.currentScreen = 'landing';
            state.answers = {};
            renderScreen();
        };

        // Initialize App on Window Load
        window.onload = function() {
            renderScreen();
        };
    </script>
</body>
</html>
